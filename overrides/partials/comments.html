{% if page.meta.comments %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
  <script src="https://giscus.app/client.js"
        data-repo="Eurekaimer/notes"
        data-repo-id="R_kgDORA1F2Q"
        data-category="Announcements"
        data-category-id="DIC_kwDORA1F2c4C2HQQ"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="light_high_contrast"
        data-lang="zh-CN"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
    </script>

  <script>
    // 让 giscus 主题跟随 site palette 切换
    (() => {
      const giscus = document.querySelector("script[src*=giscus]");
      if (!giscus) return;

      function currentTheme() {
        const palette = __md_get("__palette");
        if (!palette || typeof palette.color !== "object") return null;
        return palette.color.scheme === "slate" ? "transparent_dark" : "light";
      }

      const initial = currentTheme();
      if (initial) giscus.setAttribute("data-theme", initial);

      document.addEventListener("DOMContentLoaded", () => {
        const ref = document.querySelector("[data-md-component=palette]");
        if (!ref) return;
        ref.addEventListener("change", () => {
          const theme = currentTheme();
          const frame = document.querySelector(".giscus-frame");
          if (!theme || !frame?.contentWindow) return;
          frame.contentWindow.postMessage(
            { giscus: { setConfig: { theme } } },
            "https://giscus.app"
          );
        });
      });
    })();
  </script>
{% endif %}
