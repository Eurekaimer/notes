[project]
name = "notes"
version = "0.1.0"
description = "Eurekaimer's notes site built with Zensical"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "zensical>=0.0.19",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["notes_extensions"]
